# PO Fraud Detection API Configuration Properties
# This file contains environment-specific configuration values

# HTTP Listener Configuration
# Host and port for the HTTP listener
http.host=0.0.0.0
http.port=8081

# AI Fraud Detection Prompt Configuration
# This file contains references to external prompt files for better maintainability

# Prompt File Paths
# Each prompt is stored in a separate file for easier management and updates
prompt.amount.analysis.file=prompts/amount-analysis-prompt.txt
prompt.vendor.analysis.file=prompts/vendor-analysis-prompt.txt
prompt.timing.analysis.file=prompts/timing-analysis-prompt.txt
prompt.final.assessment.file=prompts/final-assessment-prompt.txt

# Prompt Loading Configuration
# Enable/disable specific prompt types
prompt.amount.analysis.enabled=true
prompt.vendor.analysis.enabled=true
prompt.timing.analysis.enabled=true
prompt.final.assessment.enabled=true

# Prompt Processing Configuration
# Settings for how prompts are processed and variables are substituted
prompt.variable.substitution.enabled=true
prompt.encoding=UTF-8
prompt.cache.enabled=true
