# HTTP Listener Configuration
http.listener.host=0.0.0.0
http.listener.port=8081
http.listener.basePath=/api/v1

# IDP OAuth Configuration
idp.client.id=${IDP_CLIENT_ID}
idp.client.secret=${IDP_CLIENT_SECRET}

# IDP Service URLs
idp.token.url=https://anypoint.mulesoft.com/accounts/api/v2/oauth2/token
idp.execution.url=https://idp-rt.us-east-1.anypoint.mulesoft.com/api/v1/organizations/37513a5c-61c8-4566-8c30-c9d2a08150d8/actions/494653c9-bf1a-4013-8997-228021e7b21c/versions/1.0.0/executions
idp.execution.status.url=https://idp-rt.us-east-1.anypoint.mulesoft.com/api/v1/organizations/37513a5c-61c8-4566-8c30-c9d2a08150d8/actions/494653c9-bf1a-4013-8997-228021e7b21c/versions/1.0.0/executions

# IDP Processing Configuration
idp.poll.wait.seconds=5

# HTTP Request Timeouts (in milliseconds)
http.request.timeout=30000
http.request.connection.timeout=10000

# File Upload Limits
file.upload.max.size=10485760
